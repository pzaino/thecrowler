---
ruleset_name: "Example Items Extraction Ruleset"
format_version: "1.0.0"
author: "TheCROWler Team"
created_at: "2024-03-01T12:00:00Z"
description: "Ruleset fixture for automated validation and runtime tests."
rule_groups:
  - group_name: "Group1"
    valid_from: "2021-01-01T00:00:00Z"
    valid_to: "2029-12-31T00:00:00Z"
    is_enabled: true
    scraping_rules:
      - rule_name: "Articles"
        pre_conditions:
          - path: "/articles"
        elements:
          - key: "title"
            selectors:
              - selector_type: "css"
                selector: "h1.article-title"
              - selector_type: "xpath"
                selector: "//h1[@class='article-title']"
          - key: "content"
            selectors:
              - selector_type: "css"
                selector: "div.article-content"
          - key: "date"
            selectors:
              - selector_type: "css"
                selector: "span.date"
        extract_scripts: true
    post_processing:
      - step_type: "remove"
        details:
          selector: "div.ads"
      - step_type: "replace"
        details:
          selector: "div.article-content"
          replacement: "div.article-content > p"
      - step_type: "plugin_call"
        details:
          plugin_name: "RemoveArticleContent"

  - group_name: "Group2"
    valid_from: "2021-01-01T00:00:00Z"
    valid_to: "2021-12-31T00:00:00Z"
    is_enabled: false
    scraping_rules:
      - rule_name: "News"
        pre_conditions:
          - path: "/news"
        elements:
          - key: "headline"
            selectors:
              - selector_type: "css"
                selector: "h1.headline"
          - key: "summary"
            selectors:
              - selector_type: "css"
                selector: "p.summary"
        extract_scripts: false

  - group_name: "GroupA"
    valid_from: "2021-01-01T00:00:00Z"
    valid_to: "2023-12-31T00:00:00Z"
    is_enabled: true
    scraping_rules:
      - rule_name: "Products"
        pre_conditions:
          - url: "https://www.another-example.com"
            path: "/products"
        elements:
          - key: "name"
            selectors:
            - selector_type: "css"
              selector: "div.product-name"
          - key: "price"
            selectors:
            - selector_type: "css"
              selector: "span.price"
