# Sanitized example of the test-only configuration generated by run.py.
# The harness writes a real config.yaml with fresh random credentials before
# building the source images. This file is documentation, not used directly.
version: 1.0.0
author: infoseed-compose-harness
description: Isolated InformationSeed acceptance configuration
created_at: "2026-01-01T00:00:00"

database:
  type: postgres
  host: crowler-db
  port: 5432
  user: crowler
  password: ${CROWLER_DB_PASSWORD}
  dbname: SitesIndex
  retry_time: 5
  ping_time: 5
  sslmode: disable
  optimize_for: write
  max_conns: 50
  max_idle_conns: 30
  transaction_timeout: 300

crawler:
  query_timer: 5
  workers: 3
  indexing_concurrency: 1
  engine:
    - name: crowler-engine-1
      query_timer: 5
      source_priority:
        - low
      vdi_name: []
    - name: crowler-engine-2
      query_timer: 5
      source_priority:
        - low
      vdi_name: []
  platform: desktop
  browser_platform: linux
  timeout: 30
  maintenance: 120
  max_sources: 0
  processing_timeout: 1 day
  crawling_interval: 3 days
  crawling_if_ok: 3 days
  crawling_if_error: 15 minutes

api:
  host: 0.0.0.0
  port: 8080
  enable_console: true
  disable_default: false
  enable_api_docs: true
  return_404: false
  rate_limit: "1000,1000"
  allowed_ips: []
  auth:
    enabled: true
    mode: local
    issuer: crowler-it
    audience: crowler-it
    hmac_secret: ${CROWLER_TEST_HMAC_SECRET}
    token_ttl: 3600
    local:
      enabled: true
    external:
      enabled: false

events:
  host: 0.0.0.0
  port: 8082
  auth:
    enabled: true
    mode: local
    issuer: crowler-it
    audience: crowler-it
    hmac_secret: ${CROWLER_TEST_HMAC_SECRET}
    token_ttl: 3600
    local:
      enabled: true
    external:
      enabled: false

vdi: []

information_seed:
  enabled: true
  query_timer: 1
  max_concurrent_seeds: 1
  max_queries_per_seed: 5
  max_candidates_per_seed: 40
  retry_interval: 2
  retry_backoff_max: 8
  max_attempts: 3
  heartbeat_interval: 2
  lease_duration: 30
  processing_timeout: 2 minutes
  provider_allow_list:
    - fixture_json
    - fixture_rss
  providers:
    fixture_json:
      provider: http_json
      host: http://fixture:8080
      endpoint: /search/json
      timeout: 10
      rate_limit: "0"
      max_requests: 1
      page_size: 10
      max_pages: 1
    fixture_rss:
      provider: rss_feed
      host: http://fixture:8080
      endpoint: /rss/ok
      timeout: 10
      rate_limit: "0"
      max_requests: 1
      page_size: 10
      max_pages: 1
  plugin_limits:
    timeout: 10
    max_output_size_bytes: 1048576
  retention:
    enabled: false
    completed_days: 30
    disabled_days: 30
    exhausted_days: 30
    batch_size: 100
    dry_run: false
