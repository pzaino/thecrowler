# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions: read-all

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Set up workflow test dependencies
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/workflow-venv"
        "$RUNNER_TEMP/workflow-venv/bin/python" -m pip install \
          --disable-pip-version-check --no-input 'PyYAML==6.0.2'

    - name: Workflow and exact-cleanup static regressions
      run: |
        set -euo pipefail
        "$RUNNER_TEMP/workflow-venv/bin/python" -m unittest discover \
          -s tests/integration/mcp-authorization -p 'test_*.py' -v
        bash scripts/tests/cleanup-e2e-dind.sh
        go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
          .github/workflows/mcp-authorization-e2e.yml \
          .github/workflows/postgresql-integration.yml

    # Go report seems no longer working with GitHub Actions, so we are disabling it for now. See
    #- name: Go report card
    #  uses: creekorful/goreportcard-action@1f35ced8cdac2cba28c9a2f2288a16aacfd507f9 # v1.0

    - name: Harden-Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        disable-sudo: true
        egress-policy: audit
        allowed-endpoints: >
          api.github.com:443
          dl.google.com:443
          example.com:43
          example.com:443
          github.com:443
          go.dev:443
          golang.org:443
          goreportcard.com:443
          files.pythonhosted.org:443
          pypi.org:443
          jsonplaceholder.typicode.com:443
          objects.githubusercontent.com:443
          proxy.golang.org:443
          release-assets.githubusercontent.com:443
          storage.googleapis.com:443
          sum.golang.org:443
          whois.iana.org:43
          winatp-gw-cus.microsoft.com:443
