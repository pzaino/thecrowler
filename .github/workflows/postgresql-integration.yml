name: PostgreSQL cardinality integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: postgresql-cardinality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: SitesIndex
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d SitesIndex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # PostgreSQL administrative connection.
      #
      # These deliberately duplicate the service-container values above.
      # Environment variables under services.postgres.env belong to the
      # PostgreSQL service container and are not automatically exported to
      # commands running on the GitHub Actions runner.
      POSTGRES_DB: SitesIndex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # Runtime CROWler database role.
      #
      # postgresql-setup.sh creates/configures this role and grants it the
      # permissions required by the application.
      CROWLER_DB_USER: crowler
      CROWLER_DB_PASSWORD: crowler

      # postgresql-setup.sh normally executes inside the PostgreSQL container
      # and therefore connects through the local PostgreSQL socket. In this
      # workflow it executes on the GitHub runner, so explicitly direct psql
      # to the PostgreSQL service container.
      CROWLER_DB_EXTRA_ARGS: "--host 127.0.0.1 --port 5432"

      # Database tuning values consumed by postgresql-setup.sh.
      CROWLER_DB_SHARED_BUFFERS: 128MB
      CROWLER_DB_WORK_MEM: 4MB
      CROWLER_DB_MAINTENANCE_WORK_MEM: 64MB
      CROWLER_DB_EFFECTIVE_CACHE_SIZE: 1GB
      CROWLER_DB_AUTOVACUUM_WORK_MEM: -1
      CROWLER_DB_MAX_WAL_SIZE: 1GB
      CROWLER_DB_MAX_CONNECTIONS: 100

      # Connection used by the Go PostgreSQL integration tests.
      #
      # Deliberately use the CROWler runtime role instead of postgres. This
      # ensures permission tests actually verify the permissions granted to
      # the application user rather than trivially succeeding as superuser.
      DOCKER_POSTGRES_DB_HOST: 127.0.0.1
      DOCKER_POSTGRES_DB_PORT: 5432
      DOCKER_POSTGRES_DB_NAME: SitesIndex
      DOCKER_POSTGRES_DB_USER: crowler
      DOCKER_POSTGRES_PASSWORD: crowler
      DOCKER_POSTGRES_SSL_MODE: disable

      # Prevent cached integration results and put a hard ceiling on a wedged
      # package.
      GOFLAGS: -count=1 -timeout=20m

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create current schema
        run: |
          bash ./pkg/database/postgresql-setup.sh

      - name: Verify CROWler runtime database role
        run: |
          runtime_user="$(
            PGPASSWORD="$CROWLER_DB_PASSWORD" \
            psql \
              -v ON_ERROR_STOP=1 \
              -At \
              --host "$DOCKER_POSTGRES_DB_HOST" \
              --port "$DOCKER_POSTGRES_DB_PORT" \
              --username "$CROWLER_DB_USER" \
              --dbname "$POSTGRES_DB" \
              --command "SELECT current_user"
          )"

          test "$runtime_user" = "$CROWLER_DB_USER"

      - name: Verify repeatable v1.17 migration
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -v ON_ERROR_STOP=1 \
            -v CROWLER_DB_USER="$CROWLER_DB_USER" \
            --host 127.0.0.1 \
            --port 5432 \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --file pkg/database/db_migrations/postgresql-migration-v1.17.pgsql

          current_version="$(
            PGPASSWORD="$POSTGRES_PASSWORD" \
            psql \
              -v ON_ERROR_STOP=1 \
              -At \
              --host 127.0.0.1 \
              --port 5432 \
              --username "$POSTGRES_USER" \
              --dbname "$POSTGRES_DB" \
              --command "SELECT version FROM DBSchemaVersion WHERE is_current"
          )"

          test "$current_version" = "1.17"

          writer_generation="$(
            PGPASSWORD="$POSTGRES_PASSWORD" \
            psql \
              -v ON_ERROR_STOP=1 \
              -At \
              --host 127.0.0.1 \
              --port 5432 \
              --username "$POSTGRES_USER" \
              --dbname "$POSTGRES_DB" \
              --command "SELECT writer_generation FROM DatabaseWriterCompatibility WHERE lock_id = 1"
          )"

          test "$writer_generation" = "verified-ownership-v1.17"

      - name: Verify v1.17 crawl-approval migration
        run: |
          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -v ON_ERROR_STOP=1 \
            --host 127.0.0.1 \
            --port 5432 \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --command "DROP DATABASE IF EXISTS crowler_v117 WITH (FORCE)" \
            --command "CREATE DATABASE crowler_v117"

          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -v ON_ERROR_STOP=1 \
            -v POSTGRES_DB=crowler_v117 \
            -v CROWLER_DB_USER="$CROWLER_DB_USER" \
            -v CROWLER_DB_PASSWORD="$CROWLER_DB_PASSWORD" \
            -v DB_SHARED_BUFFERS="$CROWLER_DB_SHARED_BUFFERS" \
            -v DB_WORK_MEM="$CROWLER_DB_WORK_MEM" \
            -v DB_MAINTENANCE_WORK_MEM="$CROWLER_DB_MAINTENANCE_WORK_MEM" \
            -v DB_EFFECTIVE_CACHE_SIZE="$CROWLER_DB_EFFECTIVE_CACHE_SIZE" \
            -v DB_AUTOVACUUM_WORK_MEM="$CROWLER_DB_AUTOVACUUM_WORK_MEM" \
            -v DB_MAX_WAL_SIZE="$CROWLER_DB_MAX_WAL_SIZE" \
            -v DB_MAX_CONNECTIONS="$CROWLER_DB_MAX_CONNECTIONS" \
            --host 127.0.0.1 \
            --port 5432 \
            --username "$POSTGRES_USER" \
            --dbname crowler_v117 \
            --file pkg/database/postgresql-setup.pgsql

          # Simulate an existing v1.16 deployment that predates v1.17.
          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -v ON_ERROR_STOP=1 \
            --host 127.0.0.1 \
            --port 5432 \
            --username "$POSTGRES_USER" \
            --dbname crowler_v117 \
            --command "DROP TABLE IF EXISTS CrawlApprovals" \
            --command "DROP TABLE IF EXISTS SourceOwnership" \
            --command "UPDATE DBSchemaVersion SET is_current = (version = '1.16')" \
            --command "UPDATE DatabaseWriterCompatibility SET writer_generation = 'reservation-v1.15' WHERE lock_id = 1"

          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -v ON_ERROR_STOP=1 \
            -v CROWLER_DB_USER="$CROWLER_DB_USER" \
            --host 127.0.0.1 \
            --port 5432 \
            --username "$POSTGRES_USER" \
            --dbname crowler_v117 \
            --file pkg/database/db_migrations/postgresql-migration-v1.17.pgsql

          current_version="$(
            PGPASSWORD="$POSTGRES_PASSWORD" \
            psql \
              -v ON_ERROR_STOP=1 \
              -At \
              --host 127.0.0.1 \
              --port 5432 \
              --username "$POSTGRES_USER" \
              --dbname crowler_v117 \
              --command "SELECT version FROM DBSchemaVersion WHERE is_current"
          )"
          test "$current_version" = "1.17"

          table_name="$(
            PGPASSWORD="$POSTGRES_PASSWORD" \
            psql \
              -v ON_ERROR_STOP=1 \
              -At \
              --host 127.0.0.1 \
              --port 5432 \
              --username "$POSTGRES_USER" \
              --dbname crowler_v117 \
              --command "SELECT to_regclass('public.crawlapprovals'), to_regclass('public.sourceownership')"
          )"
          test "$table_name" = "crawlapprovals|sourceownership"

          writer_generation="$(
            PGPASSWORD="$POSTGRES_PASSWORD" \
            psql \
              -v ON_ERROR_STOP=1 \
              -At \
              --host 127.0.0.1 \
              --port 5432 \
              --username "$POSTGRES_USER" \
              --dbname crowler_v117 \
              --command "SELECT writer_generation FROM DatabaseWriterCompatibility WHERE lock_id = 1"
          )"
          test "$writer_generation" = "verified-ownership-v1.17"

          # Re-running the migration must converge and preserve history.
          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -v ON_ERROR_STOP=1 \
            -v CROWLER_DB_USER="$CROWLER_DB_USER" \
            --host 127.0.0.1 \
            --port 5432 \
            --username "$POSTGRES_USER" \
            --dbname crowler_v117 \
            --file pkg/database/db_migrations/postgresql-migration-v1.17.pgsql

          # Exercise the real runtime compatibility check and API handlers
          # against the migrated database, not only SQL queries.
          THECROWLER_POSTGRES_INTEGRATION=1 DOCKER_POSTGRES_DB_NAME=crowler_v117 \
          go test -tags=integration ./pkg/database -run TestPostgresV117RuntimeCompatibility -count=1
          THECROWLER_POSTGRES_INTEGRATION=1 DOCKER_POSTGRES_DB_NAME=crowler_v117 \
          go test -tags=integration ./services/api \
            -run 'TestPostgresAuthenticatedSourceCreateAndUpdate|TestPostgresAdministrativeOwnershipVerification' \
            -count=1

          PGPASSWORD="$POSTGRES_PASSWORD" \
          psql \
            -v ON_ERROR_STOP=1 \
            --host 127.0.0.1 \
            --port 5432 \
            --username "$POSTGRES_USER" \
            --dbname "$POSTGRES_DB" \
            --command "DROP DATABASE crowler_v117 WITH (FORCE)"

      - name: Run PostgreSQL integration suite
        env:
          THECROWLER_POSTGRES_INTEGRATION: "1"
        run: |
          # Run packages serially: the keyword suppression integration test has
          # a real 30-second database window that is sensitive to CPU/IO
          # contention when several integration packages run at once.
          go test -p 1 -tags=integration ./pkg/database/... ./pkg/crawler/... ./pkg/agent/... ./services/api/...
