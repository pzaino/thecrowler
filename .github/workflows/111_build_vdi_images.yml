---
name: Build & Push VDI (Chromium) Multi-architecture

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag for the Docker image (not latest)"
        required: true
      selenium_version:
        description: "Selenium version"
        required: false
        default: "4.28.1"
      selenium_build_id:
        description: "Selenium build ID"
        required: false
        default: "20250202"
      push_latest:
        description: "Promote the verified release to :latest?"
        type: boolean
        default: true
      dry_run:
        description: "Build without publishing"
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_OWNER: zfpsystems
  IMAGE_NAME: crowler-vdi
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

# Serialize the complete release pipeline, rather than individual tags, so two
# releases can never race while promoting the shared :latest tag.
concurrency:
  group: crowler-vdi-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $TAG" >&2
            exit 1
          fi
          if [ "$TAG" = latest ]; then
            echo "The latest tag is reserved for verified promotion" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            staging_slot: p0
          - arch: arm64
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
            staging_slot: p1
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            mirror.gcr.io:443
            public.ecr.aws:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            ppa.launchpadcontent.net:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # The Docker driver makes build-vdi.sh's result available locally. QEMU is
      # intentionally absent: Chromium is built and tested on native runners.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
        with:
          driver: docker
          install: true
      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Ensure build script exists
        run: test -x scripts/build-vdi.sh
      - name: Build and validate Selenium VDI for ${{ matrix.arch }}
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          SKIP_COMPOSE: "true"
          SELENIUM_VER_NUM: ${{ inputs.selenium_version }}
          SELENIUM_BUILDID: ${{ inputs.selenium_build_id }}
          VDI_IMAGE_OUTPUT_FILE: ${{ runner.temp }}/vdi-image
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          scripts/build-vdi.sh
          test -s "$VDI_IMAGE_OUTPUT_FILE" || {
            echo "VDI image output file was not created" >&2; exit 1;
          }
          IMG="$(cat "$VDI_IMAGE_OUTPUT_FILE")"
          docker image inspect "$IMG" >/dev/null
          ACTUAL_OS="$(docker image inspect "$IMG" --format '{{.Os}}')"
          ACTUAL_ARCH="$(docker image inspect "$IMG" --format '{{.Architecture}}')"
          echo "Built image: $IMG (OS=$ACTUAL_OS Architecture=$ACTUAL_ARCH)"
          [ "$ACTUAL_OS" = linux ] || {
            echo "Expected linux image, got $ACTUAL_OS" >&2; exit 1;
          }
          [ "$ACTUAL_ARCH" = "$EXPECTED_ARCH" ] || {
            echo "Expected $EXPECTED_ARCH image, got $ACTUAL_ARCH" >&2; exit 1;
          }
          metadata="$(docker image inspect "$IMG")"
          for port in 4444 5900 7900 9222 3000; do
            jq -e --arg port "${port}/tcp" \
              '.[0].Config.ExposedPorts[$port] != null' \
              <<<"$metadata" >/dev/null || {
                echo "Missing required exposed port ${port}/tcp in $IMG" >&2
                exit 1
              }
          done
      - name: Push internal CI staging image
        if: ${{ !inputs.dry_run }}
        env:
          VDI_IMAGE_OUTPUT_FILE: ${{ runner.temp }}/vdi-image
        shell: bash
        run: |
          set -euo pipefail
          IMG="$(cat "$VDI_IMAGE_OUTPUT_FILE")"
          TARGET="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.staging_slot }}"
          docker tag "$IMG" "$TARGET"
          docker push "$TARGET"

  publish_release:
    name: Publish and validate versioned release
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Create and strictly validate versioned image
        id: release
        shell: bash
        run: |
          set -euo pipefail
          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          RELEASE="${BASE}:${{ inputs.release_tag }}"
          docker buildx imagetools create --tag "$RELEASE" \
            "${BASE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p0" \
            "${BASE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p1"

          raw="$(mktemp)"
          docker buildx imagetools inspect "$RELEASE" --raw >"$raw"
          jq . "$raw"
          jq -e '
            (.manifests | length) == 2 and
            ([.manifests[].platform | .os + "/" + .architecture] | sort)
              == ["linux/amd64", "linux/arm64"]
          ' "$raw" >/dev/null || {
            echo "Release must contain exactly linux/amd64 and linux/arm64" >&2
            exit 1
          }

          while IFS=$'\t' read -r digest expected_os expected_arch; do
            config="$(docker buildx imagetools inspect "${BASE}@${digest}" \
              --format '{{json .Image}}')"
            actual_os="$(jq -r '.os' <<<"$config")"
            actual_arch="$(jq -r '.architecture' <<<"$config")"
            [ "$actual_os/$actual_arch" = "$expected_os/$expected_arch" ] || {
              echo "Descriptor $digest says $expected_os/$expected_arch but config says $actual_os/$actual_arch" >&2
              exit 1
            }
          done < <(jq -r '.manifests[] | [.digest, .platform.os, .platform.architecture] | @tsv' "$raw")

          digest="$(docker buildx imagetools inspect "$RELEASE" \
            --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Could not resolve release index digest: $digest" >&2; exit 1;
          }
          echo "Verified canonical release digest: $digest"
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

  verify_native:
    name: Verify native pull selection (${{ matrix.arch }})
    needs: publish_release
    if: ${{ !inputs.dry_run }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Pull normally and inspect selected platform
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}:${{ inputs.release_tag }}"
          # Deliberately no --platform: this tests Docker's native index selection.
          docker pull "$IMAGE"
          actual_os="$(docker image inspect "$IMAGE" --format '{{.Os}}')"
          actual_arch="$(docker image inspect "$IMAGE" --format '{{.Architecture}}')"
          [ "$actual_os/$actual_arch" = "linux/$EXPECTED_ARCH" ] || {
            echo "Native pull selected $actual_os/$actual_arch, expected linux/$EXPECTED_ARCH" >&2
            exit 1
          }

  promote_and_cleanup:
    name: Promote verified release and clean staging tags
    needs: [publish_release, verify_native]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Promote exact verified digest to latest and verify it
        if: ${{ inputs.push_latest }}
        env:
          RELEASE_DIGEST: ${{ needs.publish_release.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          RELEASE="${BASE}:${{ inputs.release_tag }}"
          docker buildx imagetools create --tag "${BASE}:latest" "${BASE}@${RELEASE_DIGEST}"

          release_digest="$(docker buildx imagetools inspect "$RELEASE" --format '{{.Manifest.Digest}}')"
          latest_digest="$(docker buildx imagetools inspect "${BASE}:latest" --format '{{.Manifest.Digest}}')"
          [ "$release_digest" = "$RELEASE_DIGEST" ] || {
            echo "Release tag moved after verification" >&2; exit 1;
          }
          [ "$latest_digest" = "$RELEASE_DIGEST" ] || {
            echo "latest does not reference the verified release index" >&2; exit 1;
          }
          raw="$(mktemp)"
          docker buildx imagetools inspect "${BASE}:latest" --raw >"$raw"
          jq -e '
            (.manifests | length) == 2 and
            ([.manifests[].platform | .os + "/" + .architecture] | sort)
              == ["linux/amd64", "linux/arm64"]
          ' "$raw" >/dev/null || {
            echo "latest does not contain exactly the intended runtime platforms" >&2
            exit 1
          }
          echo "latest independently verified at $latest_digest"
      - name: Remove internal CI staging tags (best effort)
        if: ${{ always() }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        shell: bash
        run: |
          set -uo pipefail
          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          # regctl v0.8.3 is deliberately version-pinned for release infrastructure.
          REGCTL_IMAGE="regclient/regctl:v0.8.3"
          REGCTL_VOLUME="regctl-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$REGCTL_VOLUME" >/dev/null || {
            echo "::warning::Unable to create regctl config volume; staging tags remain"
            exit 0
          }
          trap 'docker volume rm -f "$REGCTL_VOLUME" >/dev/null 2>&1 || true' EXIT
          if ! printf '%s' "$DOCKER_PAT" | docker run --rm -i --network host \
            --volume "${REGCTL_VOLUME}:/home/appuser/.regctl" "$REGCTL_IMAGE" \
            registry login docker.io --user "$DOCKER_USERNAME" --pass-stdin; then
            echo "::warning::regctl authentication failed; CI staging tags remain"
            exit 0
          fi
          failed=false
          for slot in p0 p1; do
            image="${BASE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${slot}"
            echo "Deleting internal staging tag: $image"
            docker run --rm --network host \
              --volume "${REGCTL_VOLUME}:/home/appuser/.regctl" "$REGCTL_IMAGE" \
              tag delete "$image" --ignore-missing || failed=true
          done
          if [ "$failed" = true ]; then
            echo "::warning::Release is verified, but one or more internal CI staging tags remain"
          else
            echo "Internal CI staging tags removed successfully"
          fi
