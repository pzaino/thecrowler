---
name: Build & Push VDI (Chromium)

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for Docker image (e.g., v1.5.0)"
        required: true
      selenium_version:
        description: "Selenium version (default 4.28.1)"
        required: false
        default: "4.28.1"
      selenium_build_id:
        description: "Selenium build id (default 20250202)"
        required: false
        default: "20250202"
      push_latest:
        description: "Also update :latest multi-arch tag?"
        type: boolean
        default: true
      dry_run:
        description: "Dry run (do not push)"
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_OWNER: zfpsystems
  IMAGE_NAME: crowler-vdi

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Harden the runner (audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            mirror.gcr.io:443
            public.ecr.aws:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            ppa.launchpadcontent.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Set up Docker Buildx (use docker driver)
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
        with:
            driver: docker
            install: true

      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Ensure script exists
        run: |
          test -x scripts/build-vdi.sh || { echo "scripts/build-vdi.sh missing or not executable"; exit 1; }

      - name: Build Selenium VDI (Chromium) for ${{ matrix.arch }}
        env:
          TARGET_PLATFORM: linux/${{ matrix.arch }}${{ matrix.arch == 'arm64' && '/v8' || '' }}
          SKIP_COMPOSE: "true"
          SELENIUM_VER_NUM: ${{ inputs.selenium_version }}
          SELENIUM_BUILDID: ${{ inputs.selenium_build_id }}
          VDI_IMAGE_OUTPUT_FILE: ${{ runner.temp }}/vdi-image
        run: |
          scripts/build-vdi.sh
          echo "Listing built selenium images:"
          docker images 'selenium/standalone-*' --format '{{.Repository}}:{{.Tag}} ({{.ID}})'

      - name: Retag as ${{ env.IMAGE_NAME }}:${{ inputs.release_tag }}-${{ matrix.arch }}
        env:
          VDI_IMAGE_OUTPUT_FILE: ${{ runner.temp }}/vdi-image
        run: |
          IMG=$(cat "$VDI_IMAGE_OUTPUT_FILE")
          docker image inspect "$IMG" >/dev/null
          echo "Using source image: $IMG"
          TARGET="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}:${{ inputs.release_tag }}-${{ matrix.arch }}"
          docker tag "$IMG" "$TARGET"
          docker images "$TARGET"

      - name: Push arch image
        if: ${{ !inputs.dry_run }}
        run: |
          docker push "${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}:${{ inputs.release_tag }}-${{ matrix.arch }}"

  publish:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !inputs.dry_run }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to Docker Hub
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push manifest for ${{ inputs.release_tag }}
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            -t "${BASE}:${{ inputs.release_tag }}" \
            "${BASE}:${{ inputs.release_tag }}-amd64" \
            "${BASE}:${{ inputs.release_tag }}-arm64"

      - name: Also update :latest (optional)
        if: ${{ inputs.push_latest }}
        run: |
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            -t "${BASE}:latest" \
            "${BASE}:${{ inputs.release_tag }}-amd64" \
            "${BASE}:${{ inputs.release_tag }}-arm64"
