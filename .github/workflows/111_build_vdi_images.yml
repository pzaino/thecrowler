---
name: Build & Push VDI (Chromium)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for Docker image, for example v2.0.0"
        required: true
      selenium_version:
        description: "Selenium version"
        required: false
        default: "4.28.1"
      selenium_build_id:
        description: "Selenium build ID"
        required: false
        default: "20250202"
      push_latest:
        description: "Also update :latest multi-platform tag?"
        type: boolean
        default: true
      dry_run:
        description: "Build without publishing"
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_OWNER: zfpsystems
  IMAGE_NAME: crowler-vdi
  DOCKER_BUILDKIT: 1
  BUILDKIT_PROGRESS: plain

concurrency:
  group: crowler-vdi-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
            staging_slot: p0

          - arch: arm64
            platform: linux/arm64/v8
            runner: ubuntu-24.04-arm
            staging_slot: p1

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            mirror.gcr.io:443
            public.ecr.aws:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            ppa.launchpadcontent.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.release_tag }}"

          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker tag: $TAG" >&2
            exit 1
          fi

      # Keep the Docker driver because build-vdi.sh expects its resulting image
      # to be available through the local Docker image store.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
        with:
          driver: docker
          install: true

      # QEMU is intentionally absent. Each job runs on its native architecture.

      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Ensure build script exists
        shell: bash
        run: |
          set -euo pipefail

          test -x scripts/build-vdi.sh || {
            echo "scripts/build-vdi.sh is missing or not executable" >&2
            exit 1
          }

      - name: Build Selenium VDI for ${{ matrix.arch }}
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          SKIP_COMPOSE: "true"
          SELENIUM_VER_NUM: ${{ inputs.selenium_version }}
          SELENIUM_BUILDID: ${{ inputs.selenium_build_id }}
          VDI_IMAGE_OUTPUT_FILE: ${{ runner.temp }}/vdi-image
        shell: bash
        run: |
          set -euo pipefail

          echo "Runner architecture: $(uname -m)"
          echo "Target platform: $TARGET_PLATFORM"

          scripts/build-vdi.sh

          test -s "$VDI_IMAGE_OUTPUT_FILE" || {
            echo "VDI image output file was not created" >&2
            exit 1
          }

          IMG="$(cat "$VDI_IMAGE_OUTPUT_FILE")"

          docker image inspect "$IMG" >/dev/null

          echo "Built image: $IMG"
          docker image inspect "$IMG" \
            --format 'ID={{.Id}} OS={{.Os}} Architecture={{.Architecture}}'

      - name: Tag CI staging image
        if: ${{ !inputs.dry_run }}
        env:
          VDI_IMAGE_OUTPUT_FILE: ${{ runner.temp }}/vdi-image
        shell: bash
        run: |
          set -euo pipefail

          IMG="$(cat "$VDI_IMAGE_OUTPUT_FILE")"
          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          STAGING_TAG="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.staging_slot }}"
          TARGET="${BASE}:${STAGING_TAG}"

          echo "Source image: $IMG"
          echo "Staging image: $TARGET"

          docker tag "$IMG" "$TARGET"
          docker push "$TARGET"

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ !inputs.dry_run }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40
        with:
          egress-policy: audit
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Create release multi-platform image
        shell: bash
        run: |
          set -euo pipefail

          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          AMD_IMAGE="${BASE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p0"
          ARM_IMAGE="${BASE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p1"
          RELEASE_IMAGE="${BASE}:${{ inputs.release_tag }}"

          echo "Creating $RELEASE_IMAGE from:"
          echo "  $AMD_IMAGE"
          echo "  $ARM_IMAGE"

          docker buildx imagetools create \
            --tag "$RELEASE_IMAGE" \
            "$AMD_IMAGE" \
            "$ARM_IMAGE"

      - name: Update latest
        if: ${{ inputs.push_latest && inputs.release_tag != 'latest' }}
        shell: bash
        run: |
          set -euo pipefail

          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          AMD_IMAGE="${BASE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p0"
          ARM_IMAGE="${BASE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p1"

          docker buildx imagetools create \
            --tag "${BASE}:latest" \
            "$AMD_IMAGE" \
            "$ARM_IMAGE"

      - name: Verify multi-platform images
        shell: bash
        run: |
          set -euo pipefail

          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"

          verify_image() {
            local image="$1"
            local manifest_file

            manifest_file="$(mktemp)"

            echo "Verifying $image"

            docker buildx imagetools inspect \
              "$image" \
              --raw > "$manifest_file"

            jq . "$manifest_file"

            jq -e '
              any(
                .manifests[];
                .platform.os == "linux"
                and .platform.architecture == "amd64"
              )
              and
              any(
                .manifests[];
                .platform.os == "linux"
                and .platform.architecture == "arm64"
              )
            ' "$manifest_file" >/dev/null || {
              echo "Missing AMD64 or ARM64 manifest in $image" >&2
              rm -f "$manifest_file"
              exit 1
            }

            rm -f "$manifest_file"
          }

          verify_image "${BASE}:${{ inputs.release_tag }}"

          if [ "${{ inputs.push_latest }}" = "true" ]; then
            verify_image "${BASE}:latest"
          fi

      - name: Remove CI staging tags
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        shell: bash
        run: |
          set -uo pipefail

          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"
          AMD_IMAGE="${BASE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p0"
          ARM_IMAGE="${BASE}:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-p1"

          REGCTL_IMAGE="regclient/regctl:latest"
          REGCTL_VOLUME="regctl-config-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker volume create "$REGCTL_VOLUME" >/dev/null

          cleanup_regctl_volume() {
            docker volume rm -f "$REGCTL_VOLUME" >/dev/null 2>&1 || true
          }

          trap cleanup_regctl_volume EXIT

          echo "Authenticating regctl with Docker Hub"

          if ! printf '%s' "$DOCKER_PAT" |
            docker run --rm -i \
              --network host \
              --volume "${REGCTL_VOLUME}:/home/appuser/.regctl" \
              "$REGCTL_IMAGE" \
              registry login docker.io \
                --user "$DOCKER_USERNAME" \
                --pass-stdin
          then
            echo "::warning::regctl could not authenticate; CI staging tags were not removed"
            exit 0
          fi

          delete_tag() {
            local image="$1"

            echo "Deleting staging tag: $image"

            if ! docker run --rm \
              --network host \
              --volume "${REGCTL_VOLUME}:/home/appuser/.regctl" \
              "$REGCTL_IMAGE" \
              tag delete "$image" \
                --ignore-missing
            then
              echo "::warning::Unable to remove staging tag: $image"
              return 1
            fi
          }

          cleanup_failed=false

          delete_tag "$AMD_IMAGE" || cleanup_failed=true
          delete_tag "$ARM_IMAGE" || cleanup_failed=true

          if [ "$cleanup_failed" = "true" ]; then
            echo "::warning::The final images were published successfully, but one or more CI staging tags remain"
          else
            echo "CI staging tags removed successfully"
          fi

      - name: Verify final images after cleanup
        shell: bash
        run: |
          set -euo pipefail

          BASE="${REGISTRY}/${IMAGE_OWNER}/${IMAGE_NAME}"

          docker buildx imagetools inspect \
            "${BASE}:${{ inputs.release_tag }}"

          if [ "${{ inputs.push_latest }}" = "true" ]; then
            docker buildx imagetools inspect "${BASE}:latest"
          fi
