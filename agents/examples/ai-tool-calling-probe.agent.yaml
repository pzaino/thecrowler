# Tool-calling probe: declarative function schemas travel to the model and
# structured tool-call proposals return as INERT DATA. Nothing here executes
# a returned call, and no follow-up model request is made.
#
# Operator setup: install Ollama locally or on the LAN and point url at its
# base URL (for example http://OLLAMA_LAN_IP:11434). Install a tool-capable
# model and provide credentials only if your proxy needs them. See
# docs/crowler-agents/local-llm-providers.md.
format_version: v2
agent_identity:
  agent_id: tool-call-probe
  name: Tool Call Probe
  agent_type: observer
  owner: platform
  trust_level: trusted
  capabilities:
    - ai_reasoning
    - emit_event
  memory:
    scope: none
  constraints:
    max_steps: 6
    time_budget: 2m
jobs:
  - name: Tool Call Probe
    process: serial
    trigger_type: manual
    trigger_name: run_tool_probe
    steps:
      - action: AIInteraction
        params:
          provider: ollama
          url: "http://OLLAMA_LAN_IP:11434"
          model: "tool-capable-model"
          messages:
            - role: user
              content: "What is the forecast dividend for Oslo?"
          tools:
            - type: function
              function:
                name: get_forecast
                description: "Look up the weather forecast."
                parameters:
                  type: object
                  properties:
                    city:
                      type: string
                  required:
                    - city
          tool_choice: auto
          output_mode: normalized
      - action: CreateEvent
        params:
          event_name: ai.tool.proposal
          event_type: ai.tool.proposal
          source: "0"
          severity: info
          details:
            proposals: "$response.tool_calls"
